[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "codescope"
version = "1.0.0"
description = "Transform complex Python codebases into intuitive, interactive visual representations"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "Hemang Joshi", email = "hemangjoshi37a@gmail.com"}
]
maintainers = [
    {name = "Hemang Joshi", email = "hemangjoshi37a@gmail.com"}
]
keywords = [
    "visualization",
    "code-analysis",
    "ast",
    "python",
    "pyqt6",
    "graph",
    "networkx",
    "development-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Natural Language :: English",
]

dependencies = [
    "PyQt6>=6.0.0",
    "pyqtgraph>=0.12.0",
    "networkx>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "isort>=5.0",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-qt>=4.0",
    "coverage[toml]>=6.0",
]

[project.urls]
Homepage = "https://github.com/hemangjoshi37a/CodeScope"
Documentation = "https://github.com/hemangjoshi37a/CodeScope#readme"
Repository = "https://github.com/hemangjoshi37a/CodeScope"
"Bug Reports" = "https://github.com/hemangjoshi37a/CodeScope/issues"
Changelog = "https://github.com/hemangjoshi37a/CodeScope/releases"

[project.scripts]
codescope = "app:main"

[tool.setuptools]
py-modules = ["app", "unknown_project_handler", "demo_unknown_project", "minimal_example"]

[tool.setuptools.packages.find]
exclude = ["tests*", "*.tests*", ".vscode*", ".ipynb_checkpoints*"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
  | \.ipynb_checkpoints
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["app", "unknown_project_handler"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# mypy configuration
[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
